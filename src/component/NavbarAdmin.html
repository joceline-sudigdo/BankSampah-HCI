<link rel="stylesheet" href="../styles/component/NavbarAdmin.css">

<nav class="sidebar">
  <a class="nav-item" href="../dashboard/HomePage.html" id="nav-home">
    <div class="icon-wrap"><i class="ti ti-home"></i></div>
    <span class="label">Home</span>
  </a>
  <a class="nav-item" href="../dashboard/UsersPage.html" id="nav-users">
    <div class="icon-wrap"><i class="ti ti-users"></i></div>
    <span class="label">Users</span>
  </a>
  <a class="nav-item" href="../admin-dashboard/AdminTransactionsPage.html" id="nav-transactions">
    <div class="icon-wrap"><i class="ti ti-layout-list"></i></div>
    <span class="label">Transactions</span>
  </a>
  <a class="nav-item" href="../admin-dashboard/AdminInventoryPage.html" id="nav-inventory">
    <div class="icon-wrap"><i class="ti ti-box"></i></div>
    <span class="label">Inventory</span>

  <a class="nav-item" href="../admin-dashboard/AdminContentPage.html" id="nav-content">
    <div class="icon-wrap"><i class="ti ti-file-text"></i></div>

    <div class="icon-wrap"><i class="ti ti-user"></i></div>
    <span class="label">Profile</span>
  </a>
</nav>

<script>
  const page = window.location.pathname;
  const map = {
    'HomePage':         'nav-home',
    'UsersPage':        'nav-users',
    'TransactionsPage': 'nav-transactions',
    'InventoryPage':    'nav-inventory',
    'ContentPage':      'nav-content',
    'ProfilePage':      'nav-profile',
  };
  for (const [key, id] of Object.entries(map)) {
    if (page.includes(key)) {
      document.getElementById(id)?.classList.add('active');
      break;
    }
  }
</script>
