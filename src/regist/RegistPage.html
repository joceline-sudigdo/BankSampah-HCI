<!DOCTYPE html>
<html>
  <head>
    <title>Daftarkan akun anda!</title>
    <link rel="icon" href="../../public/icon/ic-logo.png">
    <link rel="stylesheet" href="../styles/regist/RegistPage.css">
  </head>
  <body>
    <div class="main-container">
      <div class="main-content">
        <h1 id="page-title">Daftar</h1>
        <p class="welcome-message">Buat akun pertama anda dan mulai menabung di E-Bank Sampah</p>

        <div class="form-container">
          <div class="input-form">
            <p>Nama</p>
            <input type="text" placeholder="Annisa">
          </div>
          <div class="input-form">
            <p>Alamat Email</p>
            <input type="email" placeholder="annisa@example.com">
          </div>
          <div class="input-form">
            <p>Unggah KTP</p>
            <input type="file" accept="image/*" placeholder="Unggah Foto KTP">
          </div>
          <div class="input-form">
            <p>Tanggal Lahir</p>
            <input type="date" placeholder="Pilih Tanggal Lahir">
          </div>
          <div class="input-form">
            <p>Kata sandi</p>
            <input type="password" placeholder="12345">
          </div>
          <div class="input-form">
            <p>Konfirmasi Kata Sandi</p>
            <input type="password" placeholder="12345">
          </div>
        </div>

        <div class="role-section">
          <button class="role" id="btn-nasabah" onclick="selectRole('nasabah')">Nasabah</button>
          <button class="role" id="btn-kurir" onclick="selectRole('kurir')">Kurir</button>
        </div>
        <span class="error-msg" id="role-error"></span>

        <button class="masuk-btn" onclick="handleDaftar()">Daftar</button>

        <p class="regist">Sudah punya akun? <a href="../login/LoginPage.html">Masuk</a></p>

        <p class="copyright">&copy; Bank Sampah Malang. Menjaga kelestarian kota.</p>
      </div>
    </div>

    <script>
      let selectedRole = null;

      function selectRole(role) {
        selectedRole = role;
        document.getElementById('btn-nasabah').classList.toggle('active', role === 'nasabah');
        document.getElementById('btn-kurir').classList.toggle('active', role === 'kurir');
        document.getElementById('page-title').textContent = role === 'kurir' ? 'Daftar Kurir' : 'Daftar Nasabah';
        document.getElementById('role-error').textContent = '';
        document.getElementById('btn-nasabah').classList.remove('role-error-highlight');
        document.getElementById('btn-kurir').classList.remove('role-error-highlight');
      }

      function handleDaftar() {
        if (!selectedRole) {
          document.getElementById('role-error').textContent = 'Pilih peran terlebih dahulu sebelum mendaftar.';
          document.getElementById('btn-nasabah').classList.add('role-error-highlight');
          document.getElementById('btn-kurir').classList.add('role-error-highlight');
          return;
        }

        if (selectedRole === 'kurir') {
          window.location.href = '../kurir-dashboard/Dashboard.html';
        } else {
          window.location.href = '../user-dashboard/ProfilPage.html';
        }
      }
    </script>
  </body>
</html>
