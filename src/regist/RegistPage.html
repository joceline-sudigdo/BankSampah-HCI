<!DOCTYPE html>
<html>
  <head>
    <title>Daftarkan akun anda!</title>
    <link rel="icon" href="../../public/icon/ic-logo.png">
    <link rel="stylesheet" href="../styles/regist/RegistPage.css">
  </head>
  <body>
    <div class="main-container">
      <div class="main-content">
        <h1>Daftar Nasabah</h1>
        <p class="welcome-message">Buat akun nasabah pertama anda dan mulai menabung di E-Bank Sampah</p>

        <div class="form-container">
          <div class="input-form">
            <p>Nama</p>
            <input type="text" placeholder="Annisa">
          </div>
          <div class="input-form">
            <p>Alamat Email</p>
            <input type="email" placeholder="annisa@example.com">
          </div>
          <div class="input-form">
            <p>Unggah KTP</p>
            <input type="file" accept="image/*" placeholder="Unggah Foto KTP">
          </div>
          <div class="input-form">
            <p>Tanggal Lahir</p>
            <input type="date" placeholder="Pilih Tanggal Lahir">
          </div>
          <div class="input-form">
            <p>Kata sandi</p>
            <input type="password" placeholder="12345">
          </div>
          <div class="input-form">
            <p>Konfirmasi Kata Sandi</p>
            <input type="password" placeholder="12345">
          </div>
        </div>

        <a href="">
          <button class="masuk-btn">Daftar</button>
        </a>

        <p class="regist">Sudah punya akun? <a href="../login/LoginPage.html">Masuk</a></p>

        <p class="copyright">&copy; Bank Sampah Malang. Menjaga kelestarian kota.</p>
      </div>
    </div>
  </body>
</html>
